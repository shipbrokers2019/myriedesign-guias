<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho Rápido - Myriedesign</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js para IA de lectura -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
    <!-- HEIC 2 Any para convertir fotos de iPhone automáticamente -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-pink-600">✨ Myriedesign ✨</h1>
            <p class="text-sm text-slate-500">Lector Inteligente de Guías</p>
        </header>

        <!-- Selector de Foto y Escáner -->
        <div class="bg-gradient-to-br from-pink-500 to-rose-600 p-5 rounded-2xl shadow-md text-white mb-6 text-center">
            <h2 class="font-bold text-lg mb-1">📸 Foto de la Guía</h2>
            <p class="text-xs text-pink-100 mb-4">Sube la foto y la IA rellenará los campos automáticamente.</p>
            
            <input type="file" id="fotoGuia" accept="image/*,.heic,.HEIC" class="w-full text-sm text-white file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-white file:text-pink-600 hover:file:bg-pink-50 cursor-pointer" onchange="procesarGuiaInteligente(event)">
            
            <!-- Vista previa y estado -->
            <div id="previewBox" class="mt-4 hidden">
                <img id="imagenPrevia" onclick="verImagenCompleta()" class="max-h-48 mx-auto rounded-xl shadow-lg border-2 border-white/40 object-contain bg-black/30 cursor-pointer" title="Toca para ampliar">
                <p id="estadoLectura" class="text-xs text-pink-100 mt-2 font-medium">✨ Analizando guía...</p>
            </div>
        </div>

        <!-- Formulario Automatizado -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 space-y-4">
            <h2 class="font-semibold text-slate-700 flex justify-between items-center">
                📝 <span>Datos de Destino</span>
                <span class="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-full font-bold">Auto-relleno IA</span>
            </h2>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Empresa / Courier</label>
                <select id="empresa" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-medium">
                    <option value="MRW">MRW</option>
                    <option value="TEALCA">TEALCA</option>
                    <option value="ZOOM">ZOOM</option>
                    <option value="LAE">LAE</option>
                </select>
            </div>

            <!-- Ventana / Selector rápido rosado -->
            <div id="selectorRapidoContainer" class="hidden bg-pink-50 border border-pink-200 p-3 rounded-xl">
                <label class="block text-xs font-bold text-pink-600 uppercase mb-1">👆 Opciones detectadas en la guía:</label>
                <select id="listaSugerencias" class="w-full p-2 bg-white border border-pink-300 rounded-lg text-xs font-bold text-slate-700 focus:outline-none" onchange="seleccionarSugerencia(this)">
                    <option value="">-- Selecciona el destinatario correcto --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destinatario</label>
                <input type="text" id="nombreCliente" placeholder="Nombre del cliente..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-bold text-slate-800">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Teléfono</label>
                <input type="tel" id="telefonoCliente" placeholder="Número detectado..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-mono font-bold text-slate-800">
            </div>
        </div>

        <!-- Botón de Acción WhatsApp -->
        <button onclick="enviarWhatsApp()" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-600/20 hover:bg-emerald-500 transition flex items-center justify-center gap-2">
            💬 Enviar Notificación por WhatsApp
        </button>
    </div>

    <!-- Modal para ver foto -->
    <div id="modalImagen" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4" onclick="cerrarImagenCompleta()">
        <img id="imagenModal" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl object-contain">
    </div>

    <!-- Script con Algoritmo de Extracción Robusto -->
    <script>
        let archivoSeleccionado = null;
        let urlImagenActual = "";

        async function procesarGuiaInteligente(event) {
            let archivo = event.target.files[0];
            if (!archivo) return;

            document.getElementById('telefonoCliente').value = "";
            document.getElementById('nombreCliente').value = "";
            document.getElementById('selectorRapidoContainer').classList.add('hidden');

            const estado = document.getElementById('estadoLectura');
            document.getElementById('previewBox').classList.remove('hidden');
            estado.innerText = "🔄 Preparando imagen...";

            if (archivo.name.toLowerCase().endsWith('.heic') || archivo.type === "image/heic") {
                try {
                    const conversionBlob = await heic2any({
                        blob: archivo,
                        toType: "image/jpeg",
                        quality: 0.8
                    });
                    archivo = new File([conversionBlob], archivo.name.replace(/\.[^/.]+$/, ".jpg"), { type: "image/jpeg" });
                } catch (e) {
                    console.error("Error convirtiendo HEIC:", e);
                }
            }

            archivoSeleccionado = archivo;

            const lector = new FileReader();
            lector.onload = async function(e) {
                urlImagenActual = e.target.result;
                document.getElementById('imagenPrevia').src = urlImagenActual;
                document.getElementById('imagenModal').src = urlImagenActual;
                
                estado.innerText = "🔍 Leyendo texto con IA...";

                try {
                    const resultado = await Tesseract.recognize(urlImagenActual, 'spa', {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                let porc = Math.round(m.progress * 100);
                                estado.innerText = `🔍 Leyendo texto... ${porc}%`;
                            }
                        }
                    });

                    const texto = resultado.data.text;
                    analizarTextoGuia(texto);
                    estado.innerText = "✅ ¡Datos procesados con éxito!";
                } catch (error) {
                    console.error(error);
                    estado.innerText = "⚠️ Error en la lectura.";
                }
            };
            lector.readAsDataURL(archivo);
        }

        function analizarTextoGuia(texto) {
            const textoMayus = texto.toUpperCase();
            const lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 2);

            // 1. Detectar Empresa
            let empresa = 'MRW';
            if (textoMayus.includes('TEALCA')) empresa = 'TEALCA';
            else if (textoMayus.includes('ZOOM')) empresa = 'ZOOM';
            else if (textoMayus.includes('LAE')) empresa = 'LAE';
            document.getElementById('empresa').value = empresa;

            let telefonoEncontrado = "";
            let clientesDetectados = [];

            // 2. Extracción de Teléfono ultra-flexible (busca cualquier coincidencia móvil de 11 dígitos en el texto plano)
            // Limpiamos todo lo que no sea número para aplicar la regex maestra de celulares venezolanos
            let textoSoloNumeros = textoMayus.replace(/[^0-9]/g, ' ');
            let matchCelulares = textoSoloNumeros.match(/(?:0?)(414|424|412|416|426)\s*\d{7}/g);

            if (matchCelulares && matchCelulares.length > 0) {
                // Tomamos el último número válido encontrado (suele ser el del destinatario o el más cercano al bloque de datos)
                let tlfCrudo = matchCelulares[matchCelulares.length - 1].replace(/\s+/g, '');
                if (tlfCrudo.startsWith('0') && tlfCrudo.length === 11) {
                    telefonoEncontrado = tlfCrudo.substring(1);
                } else if (tlfCrudo.length === 10) {
                    telefonoEncontrado = tlfCrudo;
                } else if (tlfCrudo.length === 11) {
                    telefonoEncontrado = tlfCrudo.substring(1);
                }
            }

            if (telefonoEncontrado) {
                document.getElementById('telefonoCliente').value = telefonoEncontrado;
            }

            // 3. Filtrado estricto para extraer solo nombres de personas
            for (let l of lineas) {
                let lUp = l.toUpperCase();

                // Descartar palabras clave que no sean nombres de clientes
                if (lUp.includes('REM') || lUp.includes('TRACKING') || lUp.includes('ORIGEN') || 
                    lUp.includes('PESO') || lUp.includes('KG') || lUp.includes('BS.') || 
                    lUp.includes('COBRO EN DESTINO') || lUp.includes('RETIRAR POR OFICINA') || 
                    lUp.includes('AV.') || lUp.includes('CALLE') || lUp.includes('URB') || 
                    lUp.includes('ESTADO') || lUp.includes('PARROQUIA') || lUp.includes('MUNICIPI') ||
                    lUp.includes('ACARIGUA') || lUp.includes('BARQUISIMETO') || lUp.includes('LECHERIA') ||
                    lUp.length < 5 || /^\d+$/.test(lUp)) {
                    continue;
                }

                // Limpiar cédulas, etiquetas y códigos numéricos
                let limpio = lUp
                    .replace(/DESTINATARIO:|DEST:|DESTINATARIO|DEST|NOMBRE|CLIENTE/g, '')
                    .replace(/[VEJG]-?\s*\d{6,}/g, '')
                    .replace(/TLF.*|TEL.*|TIF.*/g, '') 
                    .replace(/\b0?(?:414|424|412|416|426)\s*\d{7}\b/g, '')
                    .replace(/[:\-_\\/]+/g, ' ')
                    .trim();

                limpio = limpio.replace(/\s+\d+$/, '').trim();

                // Validar que la línea tenga formato de nombre (al menos dos palabras con letras y sin números puros)
                if (limpio.length > 4 && /[A-Z]{3,}/.test(limpio) && !/^\d+$/.test(limpio.replace(/\s/g, ''))) {
                    clientesDetectados.push(limpio);
                }
            }

            let unicos = [...new Set(clientesDetectados)];
            if (unicos.length > 0) {
                document.getElementById('nombreCliente').value = unicos[0];

                const selectSugerencias = document.getElementById('listaSugerencias');
                selectSugerencias.innerHTML = '<option value="">-- Selecciona el destinatario correcto --</option>';
                unicos.forEach(op => {
                    let opt = document.createElement('option');
                    opt.value = op;
                    opt.textContent = op;
                    selectSugerencias.appendChild(opt);
                });
                document.getElementById('selectorRapidoContainer').classList.remove('hidden');
            } else {
                document.getElementById('selectorRapidoContainer').classList.add('hidden');
            }
        }

        function seleccionarSugerencia(select) {
            if (select.value) {
                document.getElementById('nombreCliente').value = select.value;
            }
        }

        function verImagenCompleta() {
            if (urlImagenActual) document.getElementById('modalImagen').classList.remove('hidden');
        }

        function cerrarImagenCompleta() {
            document.getElementById('modalImagen').classList.add('hidden');
        }

        function enviarWhatsApp() {
            const empresa = document.getElementById('empresa').value;
            const nombre = document.getElementById('nombreCliente').value.trim() || "Cliente";
            let telefono = document.getElementById('telefonoCliente').value.trim();

            if (!telefono) {
                alert("Por favor verifica el teléfono del destinatario.");
                return;
            }

            if (telefono.startsWith('0')) telefono = telefono.substring(1);
            if (!telefono.startsWith('58')) telefono = '58' + telefono;

            if (archivoSeleccionado) {
                const enlaceDescarga = document.createElement('a');
                enlaceDescarga.href = urlImagenActual;
                enlaceDescarga.download = `Guia_${nombre.replace(/\s+/g, '_')}_${empresa}.jpg`;
                document.body.appendChild(enlaceDescarga);
                enlaceDescarga.click();
                document.body.removeChild(enlaceDescarga);
            }

            const mensaje = `Hola Sr./Sra. ${nombre}, 👋\n\n` +
`Su pedido ya fue enviado por la empresa *${empresa}* 📦.\n\n` +
`Gracias por su compra! 🙏\n\n` +
`Recuerde que es importante darle los cuidados adecuados a sus piezas:\n` +
`❤️ Mantener limpias y secas.\n` +
`❤️ Alejar de químicos (alcohol, perfumes, cremas, jabones).\n` +
`❤️ Colocar cuando la piel esté seca.\n` +
`❤️ No mojar ni usar en playa o piscinas.\n` +
`❤️ Evitar hacer ejercicios con ellas.\n\n` +
`De esta manera extenderá la vida útil y brillo de sus piezas ✨✨\n\n` +
`Saludos, Myriedesign`;

            const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            
            setTimeout(() => {
                window.open(urlWhatsApp, '_blank');
            }, 300);
        }
    </script>
</body>
</html>
