<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho Rápido - Myriedesign</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js para IA de lectura -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-pink-600">✨ Myriedesign ✨</h1>
            <p class="text-sm text-slate-500">Lector Inteligente de Guías</p>
        </header>

        <!-- Selector de Foto y Escáner -->
        <div class="bg-gradient-to-br from-pink-500 to-rose-600 p-5 rounded-2xl shadow-md text-white mb-6 text-center">
            <h2 class="font-bold text-lg mb-1">📸 Foto de la Guía</h2>
            <p class="text-xs text-pink-100 mb-4">Sube la foto y la IA rellenará los campos automáticamente.</p>
            
            <input type="file" id="fotoGuia" accept="image/*" class="w-full text-sm text-white file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-white file:text-pink-600 hover:file:bg-pink-50 cursor-pointer" onchange="procesarGuiaInteligente(event)">
            
            <!-- Vista previa y estado -->
            <div id="previewBox" class="mt-4 hidden">
                <img id="imagenPrevia" onclick="verImagenCompleta()" class="max-h-48 mx-auto rounded-xl shadow-lg border-2 border-white/40 object-contain bg-black/30 cursor-pointer" title="Toca para ampliar">
                <p id="estadoLectura" class="text-xs text-pink-100 mt-2 font-medium">✨ Analizando guía...</p>
            </div>
        </div>

        <!-- Formulario Automatizado -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 space-y-4">
            <h2 class="font-semibold text-slate-700 flex justify-between items-center">
                📝 <span>Datos Detectados</span>
                <span class="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-full font-bold">Auto-relleno IA</span>
            </h2>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Empresa / Courier</label>
                <select id="empresa" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-medium">
                    <option value="TEALCA">TEALCA</option>
                    <option value="MRW">MRW</option>
                    <option value="ZOOM">ZOOM</option>
                    <option value="LAE">LAE</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destinatario (Nombre y Cédula)</label>
                <input type="text" id="nombreCliente" placeholder="Esperando foto..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-bold text-slate-800">
                <p class="text-[11px] text-slate-400 mt-1">Verifica si el nombre es correcto.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Teléfono</label>
                <input type="tel" id="telefonoCliente" placeholder="Esperando foto..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-mono">
                <p class="text-[11px] text-slate-400 mt-1">Número detectado en la guía.</p>
            </div>
        </div>

        <!-- Botón de Acción WhatsApp -->
        <button onclick="enviarWhatsApp()" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-600/20 hover:bg-emerald-500 transition flex items-center justify-center gap-2">
            💬 Enviar Notificación por WhatsApp
        </button>
    </div>

    <!-- Modal para ver foto -->
    <div id="modalImagen" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4" onclick="cerrarImagenCompleta()">
        <img id="imagenModal" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl object-contain">
    </div>

    <!-- Script con Lógica de Teléfonos Protegida y Extracción Quirúrgica -->
    <script>
        let archivoSeleccionado = null;
        let urlImagenActual = "";

        async function procesarGuiaInteligente(event) {
            archivoSeleccionado = event.target.files[0];
            if (!archivoSeleccionado) return;

            const lector = new FileReader();
            lector.onload = async function(e) {
                urlImagenActual = e.target.result;
                document.getElementById('imagenPrevia').src = urlImagenActual;
                document.getElementById('imagenModal').src = urlImagenActual;
                document.getElementById('previewBox').classList.remove('hidden');
                
                const estado = document.getElementById('estadoLectura');
                estado.innerText = "🔍 Leyendo texto de la guía...";

                try {
                    const resultado = await Tesseract.recognize(urlImagenActual, 'spa');
                    const texto = resultado.data.text;
                    console.log("Texto bruto de la IA:", texto);

                    extraerDatosConPrecision(texto);
                    estado.innerText = "✅ ¡Datos rellenados automáticamente!";
                } catch (error) {
                    console.error(error);
                    estado.innerText = "⚠️ Error al leer. Puedes rellenar manual.";
                }
            };
            lector.readAsDataURL(archivoSeleccionado);
        }

        function extraerDatosConPrecision(texto) {
            const lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const textoMayus = texto.toUpperCase();

            // 1. Detección de Empresa Courier
            if (textoMayus.includes('TEALCA')) document.getElementById('empresa').value = 'TEALCA';
            else if (textoMayus.includes('MRW')) document.getElementById('empresa').value = 'MRW';
            else if (textoMayus.includes('ZOOM')) document.getElementById('empresa').value = 'ZOOM';
            else if (textoMayus.includes('LAE')) document.getElementById('empresa').value = 'LAE';

            // 2. LÓGICA DE TELÉFONOS (PROTEGIDA Y 100% INTACTA)
            let telefonoEncontrado = "";
            const regexCelular = /(?:0?(?:414|424|412|416|426)\d{7})/g;
            const matchesCel = texto.match(regexCelular);
            
            if (matchesCel && matchesCel.length > 0) {
                telefonoEncontrado = matchesCel[0];
            } else {
                const numerosLimpios = texto.replace(/\D/g, ' ');
                const palabrasNum = numerosLimpios.split(/\s+/).filter(n => n.length >= 10 && n.length <= 11 && !n.startsWith('8464') && !n.startsWith('5117') && !n.startsWith('0310'));
                if (palabrasNum.length > 0) {
                    telefonoEncontrado = palabrasNum[0];
                }
            }

            if (telefonoEncontrado) {
                if (telefonoEncontrado.startsWith('0')) telefonoEncontrado = telefonoEncontrado.substring(1);
                document.getElementById('telefonoCliente').value = telefonoEncontrado;
            }

            // 3. EXTRACCIÓN QUIRÚRGICA DE CÉDULA Y NOMBRE
            let cedulaEncontrada = "";
            let nombreLimpio = "";

            // Buscar la cédula exacta (Ej: V-8142710 o V8142710)
            const matchCedula = texto.match(/(?:V|E|J|G)[\s\-]?\d{6,8}/i);
            if (matchCedula) {
                // Formatearla siempre limpia como V-XXXXXXXX
                let numerosCedula = matchCedula[0].replace(/\D/g, '');
                let letraCedula = matchCedula[0].charAt(0).toUpperCase();
                cedulaEncontrada = `${letraCedula}-${numerosCedula}`;
            }

            // Buscar línea que contenga la cédula o palabras de destinatario
            for (let i = 0; i < lineas.length; i++) {
                let linea = lineas[i];
                let lUp = linea.toUpperCase();

                if (/(?:V|E|J|G)[\s\-]?\d{6,8}/.test(lUp) || lUp.includes('DESTINATARIO') || lUp.includes('CLIENTE')) {
                    // Quitar etiquetas, códigos basura de barras (como pesT, etc) y caracteres extraños
                    let temporal = linea
                        .replace(/(?:V|E|J|G)[\s\-]?\d{6,8}/gi, '') // Quitamos la cédula temporalmente para aislar el nombre
                        .replace(/DESTINATARIO|CLIENTE|NOMBRE|C\.I\.|CEDULA|TLF|TEL:|TELF|PEST|MER|CCS|ESTANDAR/gi, '')
                        .replace(/[:\-_\/\\|]+/g, ' ')
                        .replace(/\s+/g, ' ')
                        .trim();

                    // Si quedan palabras con letras válidas de nombre
                    if (temporal.length > 2 && /[A-ZÁÉÍÓÚÑ]/.test(temporal.toUpperCase()) && temporal.toUpperCase() !== 'BISUTERIA') {
                        nombreLimpio = temporal;
                        break;
                    }
                }
            }

            // Si no se armó por línea con cédula, buscar por proximidad de texto común de nombres
            if (!nombreLimpio) {
                const ignorar = ['TRACKING', 'BISUTERIA', 'TEALCA', 'MRW', 'ZOOM', 'DOMESA', 'LAE', 'CIUDAD', 'DIRECCION', 'REMITE', 'VALOR', 'ORIGEN', 'DESTINO', 'OFICINA', 'SOBRE', 'PESO', 'COBRAR', 'ENVIADO', 'ENTREGA', 'MER', 'CCS'];
                for (let linea of lineas) {
                    let lUp = linea.toUpperCase();
                    let esIgnorada = ignorar.some(p => lUp.includes(p));
                    if (linea.length >= 4 && linea.length <= 35 && /^[A-ZÁÉÍÓÚÑ\s\.]+$/.test(lUp) && !esIgnorada && !/\d{5,}/.test(linea)) {
                        nombreLimpio = linea.replace(/\s+/g, ' ').trim();
                        break;
                    }
                }
            }

            // Consolidación final del campo Nombre y Cédula sin duplicaciones
            if (nombreLimpio && cedulaEncontrada) {
                document.getElementById('nombreCliente').value = `${nombreLimpio} - ${cedulaEncontrada}`;
            } else if (nombreLimpio) {
                document.getElementById('nombreCliente').value = nombreLimpio;
            } else if (cedulaEncontrada) {
                document.getElementById('nombreCliente').value = `Cliente - ${cedulaEncontrada}`;
            }
        }

        function verImagenCompleta() {
            if (urlImagenActual) {
                document.getElementById('modalImagen').classList.remove('hidden');
            }
        }

        function cerrarImagenCompleta() {
            document.getElementById('modalImagen').classList.add('hidden');
        }

        function enviarWhatsApp() {
            const empresa = document.getElementById('empresa').value;
            const nombre = document.getElementById('nombreCliente').value.trim() || "Cliente";
            let telefono = document.getElementById('telefonoCliente').value.trim();

            if (!telefono) {
                alert("Por favor verifica el teléfono del destinatario.");
                return;
            }

            if (telefono.startsWith('0')) telefono = telefono.substring(1);
            if (!telefono.startsWith('58')) telefono = '58' + telefono;

            if (archivoSeleccionado) {
                const enlaceDescarga = document.createElement('a');
                enlaceDescarga.href = urlImagenActual;
                enlaceDescarga.download = `Guia_${nombre.replace(/\s+/g, '_')}_${empresa}.jpg`;
                document.body.appendChild(enlaceDescarga);
                enlaceDescarga.click();
                document.body.removeChild(enlaceDescarga);
            }

            const mensaje = `Hola Sr./Sra. ${nombre}, 👋\n\n` +
`Su pedido ya fue enviado por la empresa *${empresa}* 📦.\n\n` +
`Gracias por su compra! 🙏\n\n` +
`Recuerde que es importante darle los cuidados adecuados a sus piezas:\n` +
`❤️ Mantener limpias y secas.\n` +
`❤️ Alejar de químicos (alcohol, perfumes, cremas, jabones).\n` +
`❤️ Colocar cuando la piel esté seca.\n` +
`❤️ No mojar ni usar en playa o piscinas.\n` +
`❤️ Evitar hacer ejercicios con ellas.\n\n` +
`De esta manera extenderá la vida útil y brillo de sus piezas ✨✨\n\n` +
`Saludos, Myriedesign`;

            const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            
            setTimeout(() => {
                window.open(urlWhatsApp, '_blank');
            }, 300);
        }
    </script>
</body>
</html>
