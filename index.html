<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho Rápido - Myriedesign</title>
    <!-- Tailwind CSS para diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de código abierto para escaneo -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-pink-600">✨ Myriedesign ✨</h1>
            <p class="text-sm text-slate-500">Gestor Inteligente de Envíos y WhatsApp</p>
        </header>

        <!-- Sección de Escaneo o Carga de Foto de Guía -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <h2 class="font-semibold text-slate-700 mb-2 flex items-center justify-between">
                <span>📷 1. Escanear o Subir Foto de la Guía</span>
            </h2>
            <p class="text-xs text-slate-400 mb-3">Toma una foto o selecciona la imagen de la etiqueta (Tealca, LAE, Zoom, Mrw) para leer el código de barras al instante.</p>
            
            <!-- Input oculto para abrir la cámara de fotos o galería -->
            <input type="file" id="qr-input-file" accept="image/*" capture="environment" class="hidden" onchange="procesarImagenSeleccionada(event)">
            
            <button onclick="document.getElementById('qr-input-file').click()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-medium hover:bg-slate-800 transition flex items-center justify-center gap-2 shadow-sm">
                📸 Tomar Foto o Subir Guía
            </button>
        </div>

        <!-- Formulario de Datos del Envío -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 space-y-4">
            <h2 class="font-semibold text-slate-700 flex items-center gap-2">
                📝 2. Datos del Destinatario y Envío
            </h2>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Empresa / Courier</label>
                <select id="empresa" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-medium">
                    <option value="TEALCA">TEALCA</option>
                    <option value="LAE">LAE</option>
                    <option value="ZOOM">ZOOM</option>
                    <option value="MRW">MRW</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Número de Tracking / Guía</label>
                <input type="text" id="tracking" placeholder="Se llena automáticamente al escanear" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:border-pink-500 font-bold text-pink-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nombre del Destinatario</label>
                <input type="text" id="nombreCliente" placeholder="Ej. Maria Faria" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Teléfono (con código de país 58)</label>
                <input type="tel" id="telefonoCliente" placeholder="Ej. 584144609226" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destino (Ciudad)</label>
                <input type="text" id="destino" placeholder="Ej. TURMERO" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm uppercase focus:outline-none focus:border-pink-500">
            </div>
        </div>

        <!-- Botón de Acción WhatsApp -->
        <button onclick="enviarWhatsApp()" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-600/20 hover:bg-emerald-500 transition flex items-center justify-center gap-2">
            💬 Enviar Notificación por WhatsApp
        </button>
    </div>

    <!-- Script de lógica -->
    <script>
        function procesarImagenSeleccionada(e) {
            if (e.target.files.length === 0) return;
            const imageFile = e.target.files[0];
            
            const html5QrCode = new Html5Qrcode("reader-hidden-div");
            
            // Creamos un div invisible para procesar la imagen internamente
            let hiddenDiv = document.getElementById("reader-hidden-div");
            if(!hiddenDiv) {
                hiddenDiv = document.createElement('div');
                hiddenDiv.id = "reader-hidden-div";
                hiddenDiv.style.display = "none";
                document.body.appendChild(hiddenDiv);
            }

            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    document.getElementById('tracking').value = decodedText;
                    detectarCourierInteligente(decodedText);
                    alert("¡Guía leída con éxito: " + decodedText + "!");
                    if (navigator.vibrate) navigator.vibrate(200);
                })
                .catch(err => {
                    alert("No se pudo leer el código de barras en la foto. Intenta tomar la foto más de cerca enfocando el código.");
                });
        }

        function detectarCourierInteligente(codigo) {
            const selectEmpresa = document.getElementById('empresa');
            if (codigo.startsWith("23") || codigo.length === 15) {
                selectEmpresa.value = "LAE";
            } else if (codigo.startsWith("84") || codigo.length === 8) {
                selectEmpresa.value = "TEALCA";
            } else if (codigo.startsWith("03") || codigo.length === 13) {
                selectEmpresa.value = "ZOOM";
            } else {
                selectEmpresa.value = "MRW";
            }
        }

        function enviarWhatsApp() {
            const empresa = document.getElementById('empresa').value;
            const tracking = document.getElementById('tracking').value;
            const nombre = document.getElementById('nombreCliente').value.trim() || "Cliente";
            const telefono = document.getElementById('telefonoCliente').value.trim();
            const destino = document.getElementById('destino').value.toUpperCase().trim() || "SU CIUDAD";

            if (!tracking || !telefono) {
                alert("Por favor asegúrate de escanear la guía y colocar el teléfono del cliente.");
                return;
            }

            const hoy = new Date();
            const fechaEnvio = String(hoy.getDate()).padStart(2, '0') + '/' + 
                               String(hoy.getMonth() + 1).padStart(2, '0') + '/' + 
                               hoy.getFullYear();

            const mensaje = `Hola Sr./Sra. ${nombre}, 👋\n\n` +
`Su pedido ya fue enviado. Aquí el resumen:\n\n` +
`📦 Empresa: ${empresa}\n` +
`🔢 Tracking: ${tracking}\n` +
`🏠 Destino: ${destino}\n` +
`📅 Fecha de envío: ${fechaEnvio}\n\n` +
`Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n` +
`Gracias por su compra! 🙏\n` +
`Recuerde que es importante darle los cuidados adecuados:\n` +
`❤️Mantener limpias y secas.\n` +
`❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n` +
`❤️Colocar cuando la piel esté seca\n` +
`❤️No mojar ni usar en playa o piscinas\n` +
`❤️Evitar hacer ejercicios con ellas\n\n` +
`De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n` +
`Saludos Myriedesign`;

            const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
