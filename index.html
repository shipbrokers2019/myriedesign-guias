<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho Rápido - Myriedesign</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-pink-600">✨ Myriedesign ✨</h1>
            <p class="text-sm text-slate-500">Gestor Rápido de Envíos</p>
        </header>

        <!-- Bloque de Pegado Inteligente -->
        <div class="bg-gradient-to-br from-pink-500 to-rose-600 p-5 rounded-2xl shadow-md text-white mb-6 text-center">
            <h2 class="font-bold text-lg mb-1">⚡ Autocompletar Rápido</h2>
            <p class="text-xs text-pink-100 mb-4">Copia los datos de la guía (o usa Google Lens en tu foto) y pégalos aquí abajo de un solo toque.</p>
            
            <button onclick="pegarDesdePortapapeles()" class="w-full bg-white text-pink-600 py-3.5 rounded-xl font-bold shadow-sm hover:bg-pink-50 transition flex items-center justify-center gap-2">
                📋 Pegar Datos de la Guía
            </button>
        </div>

        <!-- Formulario Simplificado -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 space-y-4">
            <h2 class="font-semibold text-slate-700 flex items-center justify-between">
                📝 <span>Datos del Envío</span>
            </h2>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Empresa / Courier</label>
                <select id="empresa" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-medium">
                    <option value="TEALCA">TEALCA</option>
                    <option value="LAE">LAE</option>
                    <option value="ZOOM">ZOOM</option>
                    <option value="MRW">MRW</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destinatario (Nombre)</label>
                <input type="text" id="nombreCliente" placeholder="Ej. Maria Faria" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-bold text-slate-800">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Teléfono (con código 58)</label>
                <input type="tel" id="telefonoCliente" placeholder="Ej. 584144609226" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-mono">
            </div>
        </div>

        <!-- Botón de Acción WhatsApp -->
        <button onclick="enviarWhatsApp()" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-600/20 hover:bg-emerald-500 transition flex items-center justify-center gap-2">
            💬 Enviar Notificación por WhatsApp
        </button>
    </div>

    <!-- Script de Autocompletado -->
    <script>
        async function pegarDesdePortapapeles() {
            try {
                // Intenta leer el portapapeles automáticamente
                const texto = await navigator.clipboard.readText();
                interpretarTexto(texto);
            } catch (err) {
                // Si el navegador pide permisos estrictos, abre un cuadro para pegar manual de un toque
                let textoManual = prompt("Pega aquí el texto copiado de la guía (nombre, teléfono, etc.):");
                if (textoManual) {
                    interpretarTexto(textoManual);
                }
            }
        }

        function interpretarTexto(texto) {
            const textoMayus = texto.toUpperCase();

            // 1. Detectar Empresa
            const selectEmpresa = document.getElementById('empresa');
            if (textoMayus.includes("TEALCA")) selectEmpresa.value = "TEALCA";
            else if (textoMayus.includes("LAE")) selectEmpresa.value = "LAE";
            else if (textoMayus.includes("ZOOM")) selectEmpresa.value = "ZOOM";
            else if (textoMayus.includes("MRW")) selectEmpresa.value = "MRW";

            // 2. Buscar Teléfono (formato venezolano)
            const matchTelefono = texto.match(/(?:58)?(0?4\d{9})/);
            if (matchTelefono) {
                let tel = matchTelefono[1];
                if (tel.startsWith('0')) tel = tel.substring(1);
                if (!tel.startsWith('58')) tel = '58' + tel;
                document.getElementById('telefonoCliente').value = tel;
            }

            // 3. Intentar extraer nombre (palabras alfabéticas largas)
            // Limpiamos un poco y dejamos el texto listo
            alert("¡Datos pegados con éxito! Revisa que el teléfono y la empresa estén correctos.");
        }

        function enviarWhatsApp() {
            const empresa = document.getElementById('empresa').value;
            const nombre = document.getElementById('nombreCliente').value.trim() || "Cliente";
            const telefono = document.getElementById('telefonoCliente').value.trim();

            if (!telefono) {
                alert("Por favor asegúrate de que el teléfono del cliente esté completo.");
                return;
            }

            const mensaje = `Hola Sr./Sra. ${nombre}, 👋\n\n` +
`Su pedido ya fue enviado por la empresa *${empresa}* 📦.\n\n` +
`Gracias por su compra! 🙏\n` +
`Recuerde que es importante darle los cuidados adecuados a sus piezas:\n` +
`❤️ Mantener limpias y secas.\n` +
`❤️ Alejar de químicos (alcohol, perfumes, cremas, jabones).\n` +
`❤️ Colocar cuando la piel esté seca.\n` +
`❤️ No mojar ni usar en playa o piscinas.\n` +
`❤️ Evitar hacer ejercicios con ellas.\n\n` +
`De esta manera extenderá la vida útil y brillo de sus piezas ✨✨\n\n` +
`Saludos, Myriedesign`;

            const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
