<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho Rápido - Myriedesign</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-pink-600">✨ Myriedesign ✨</h1>
            <p class="text-sm text-slate-500">Gestor Rápido de Envíos</p>
        </header>

        <!-- Selector de Foto con Vista Previa -->
        <div class="bg-gradient-to-br from-pink-500 to-rose-600 p-5 rounded-2xl shadow-md text-white mb-6 text-center">
            <h2 class="font-bold text-lg mb-1">📸 Foto de la Guía</h2>
            <p class="text-xs text-pink-100 mb-4">Toma o selecciona la foto de la guía para procesarla.</p>
            
            <input type="file" id="fotoGuia" accept="image/*" class="w-full text-sm text-white file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-white file:text-pink-600 hover:file:bg-pink-50 cursor-pointer" onchange="procesarFoto(event)">
            
            <!-- Vista previa de la foto -->
            <div id="previewBox" class="mt-4 hidden">
                <img id="imagenPrevia" class="max-h-40 mx-auto rounded-xl shadow-inner border border-pink-400 object-contain bg-black/20">
                <p class="text-xs text-pink-100 mt-2 font-medium">✔️ Imagen cargada con éxito</p>
            </div>
        </div>

        <!-- Formulario de Datos -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 space-y-4">
            <h2 class="font-semibold text-slate-700 flex justify-between items-center">
                <span>📝 Datos del Envío</span>
                <span class="text-[10px] bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full font-bold">Rápido</span>
            </h2>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Empresa / Courier</label>
                <select id="empresa" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-medium">
                    <option value="TEALCA">TEALCA</option>
                    <option value="LAE">LAE</option>
                    <option value="ZOOM">ZOOM</option>
                    <option value="MRW">MRW</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destinatario (Nombre)</label>
                <input type="text" id="nombreCliente" placeholder="Ej. Maria Faria" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-bold text-slate-800">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Teléfono (con código 58)</label>
                <input type="tel" id="telefonoCliente" placeholder="Ej. 584144609226" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-mono">
            </div>
        </div>

        <!-- Botón de Acción WhatsApp -->
        <button onclick="enviarWhatsApp()" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-600/20 hover:bg-emerald-500 transition flex items-center justify-center gap-2">
            💬 Enviar Notificación por WhatsApp
        </button>
    </div>

    <!-- Script de Procesamiento Inteligente -->
    <script>
        function procesarFoto(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            // Mostrar la foto en miniatura en la pantalla
            const lector = new FileReader();
            lector.onload = function(e) {
                const img = document.getElementById('imagenPrevia');
                img.src = e.target.result;
                document.getElementById('previewBox').classList.remove('hidden');
            }
            lector.readAsDataURL(archivo);

            // Intentar detectar si el nombre del archivo o metadatos traen pistas, 
            // y dar aviso visual de que está lista para completar.
            alert("¡Foto cargada correctamente! Verifica el teléfono y el nombre del destinatario para enviar.");
        }

        function enviarWhatsApp() {
            const empresa = document.getElementById('empresa').value;
            const nombre = document.getElementById('nombreCliente').value.trim() || "Cliente";
            let telefono = document.getElementById('telefonoCliente').value.trim();

            if (!telefono) {
                alert("Por favor ingresa el teléfono del destinatario.");
                return;
            }

            // Limpiar formato de teléfono por si escribieron el 0 inicial
            if (telefono.startsWith('0')) {
                telefono = telefono.substring(1);
            }
            if (!telefono.startsWith('58')) {
                telefono = '58' + telefono;
            }

            const mensaje = `Hola Sr./Sra. ${nombre}, 👋\n\n` +
`Su pedido ya fue enviado por la empresa *${empresa}* 📦.\n\n` +
`Gracias por su compra! 🙏\n` +
`Recuerde que es importante darle los cuidados adecuados a sus piezas:\n` +
`❤️ Mantener limpias y secas.\n` +
`❤️ Alejar de químicos (alcohol, perfumes, cremas, jabones).\n` +
`❤️ Colocar cuando la piel esté seca.\n` +
`❤️ No mojar ni usar en playa o piscinas.\n` +
`❤️ Evitar hacer ejercicios con ellas.\n\n` +
`De esta manera extenderá la vida útil y brillo de sus piezas ✨✨\n\n` +
`Saludos, Myriedesign`;

            const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
