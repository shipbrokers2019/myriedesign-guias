<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho Rápido - Myriedesign</title>
    <!-- Tailwind CSS para diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de código abierto para escaneo de códigos -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-pink-600">✨ Myriedesign ✨</h1>
            <p class="text-sm text-slate-500">Gestor Inteligente de Envíos y WhatsApp</p>
        </header>

        <!-- Sección de Escaneo de Tracking -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <h2 class="font-semibold text-slate-700 mb-2 flex items-center justify-between">
                <span>📷 1. Escanear Código de Guía</span>
                <span id="estado-camara" class="text-xs px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full">Inactivo</span>
            </h2>
            <p class="text-xs text-slate-400 mb-3">Apunta la cámara al código de barras o QR de Tealca, LAE, Zoom o Mrw.</p>
            <div id="reader" class="w-full rounded-lg overflow-hidden mb-3 bg-slate-100"></div>
            
            <div class="flex gap-2">
                <button id="btn-iniciar" onclick="iniciarEscaneo()" class="flex-1 bg-slate-900 text-white py-2.5 rounded-xl font-medium hover:bg-slate-800 transition">
                    Activar Cámara
                </button>
                <button id="btn-detener" onclick="detenerEscaneo()" class="flex-1 bg-red-100 text-red-600 py-2.5 rounded-xl font-medium hidden hover:bg-red-200 transition">
                    Apagar Cámara
                </button>
            </div>
        </div>

        <!-- Formulario de Datos del Envío -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 space-y-4">
            <h2 class="font-semibold text-slate-700 flex items-center gap-2">
                📝 2. Datos del Destinatario y Envío
            </h2>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Empresa / Courier</label>
                <select id="empresa" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500 font-medium">
                    <option value="TEALCA">TEALCA</option>
                    <option value="LAE">LAE</option>
                    <option value="ZOOM">ZOOM</option>
                    <option value="MRW">MRW</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Número de Tracking / Guía</label>
                <input type="text" id="tracking" placeholder="Ej. 84640600 o 2300..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:border-pink-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nombre del Destinatario</label>
                <input type="text" id="nombreCliente" placeholder="Ej. Maria Faria / Adais / Ingrid" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Teléfono (con código de país 58)</label>
                <input type="tel" id="telefonoCliente" placeholder="Ej. 584144609226" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-pink-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destino (Ciudad)</label>
                <input type="text" id="destino" placeholder="Ej. TURMERO / EL DORADO / SOCOPO" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm uppercase focus:outline-none focus:border-pink-500">
            </div>
        </div>

        <!-- Botón de Acción WhatsApp -->
        <button onclick="enviarWhatsApp()" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-600/20 hover:bg-emerald-500 transition flex items-center justify-center gap-2">
            💬 Enviar Notificación por WhatsApp
        </button>
    </div>

    <!-- Script de lógica -->
    <script>
        let html5QrCode;

        function iniciarEscaneo() {
            const btnIniciar = document.getElementById('btn-iniciar');
            const btnDetener = document.getElementById('btn-detener');
            const badgeEstado = document.getElementById('estado-camara');
            
            btnIniciar.classList.add('hidden');
            btnDetener.classList.remove('hidden');
            badgeEstado.textContent = "Escaneando...";
            badgeEstado.className = "text-xs px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full font-medium animate-pulse";

            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 260, height: 160 } };

            Html5Qrcode.getCameras().devices.then(devices => {
                if (devices && devices.length) {
                    let cameraId = devices[devices.length - 1].id; 
                    html5QrCode.start(
                        cameraId, 
                        config, 
                        (decodedText) => { procesarCodigoEscaneado(decodedText); },
                        (errorMessage) => {}
                    );
                } else {
                    alertaError("No se encontró cámara.");
                }
            }).catch(err => {
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    (decodedText) => { procesarCodigoEscaneado(decodedText); },
                    (errorMessage) => {}
                ).catch(e => {
                    alertaError("Error de permisos de cámara.");
                });
            });
        }

        function procesarCodigoEscaneado(codigo) {
            document.getElementById('tracking').value = codigo;
            detectarCourierInteligente(codigo);
            detenerEscaneo();
            
            // Vibración sutil de éxito si el celular lo soporta
            if (navigator.vibrate) navigator.vibrate(200);
        }

        function detenerEscaneo() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    restaurarBotonesCamara();
                }).catch(err => restaurarBotonesCamara());
            } else {
                restaurarBotonesCamara();
            }
        }

        function restaurarBotonesCamara() {
            document.getElementById('btn-iniciar').classList.remove('hidden');
            document.getElementById('btn-detener').classList.add('hidden');
            const badgeEstado = document.getElementById('estado-camara');
            badgeEstado.textContent = "Inactivo";
            badgeEstado.className = "text-xs px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full";
        }

        function alertaError(mensaje) {
            alert(mensaje);
            detenerEscaneo();
        }

        function detectarCourierInteligente(codigo) {
            const selectEmpresa = document.getElementById('empresa');
            // Lógica según los patrones de las guías de tus fotos
            if (codigo.startsWith("23") || codigo.length === 15) {
                selectEmpresa.value = "LAE";
            } else if (codigo.startsWith("84") || codigo.length === 8) {
                selectEmpresa.value = "TEALCA";
            } else if (codigo.startsWith("03") || codigo.length === 13) {
                selectEmpresa.value = "ZOOM";
            } else if (codigo.length >= 10 && !isNaN(codigo)) {
                selectEmpresa.value = "MRW";
            } else {
                selectEmpresa.value = "TEALCA";
            }
        }

        function enviarWhatsApp() {
            const empresa = document.getElementById('empresa').value;
            const tracking = document.getElementById('tracking').value;
            const nombre = document.getElementById('nombreCliente').value.trim() || "Cliente";
            const telefono = document.getElementById('telefonoCliente').value.trim();
            const destino = document.getElementById('destino').value.toUpperCase().trim() || "SU CIUDAD";

            if (!tracking || !telefono) {
                alert("Por favor verifica que el tracking esté escaneado y el teléfono del cliente esté escrito.");
                return;
            }

            const hoy = new Date();
            const fechaEnvio = String(hoy.getDate()).padStart(2, '0') + '/' + 
                               String(hoy.getMonth() + 1).padStart(2, '0') + '/' + 
                               hoy.getFullYear();

            const mensaje = `Hola Sr./Sra. ${nombre}, 👋\n\n` +
`Su pedido ya fue enviado. Aquí el resumen:\n\n` +
`📦 Empresa: ${empresa}\n` +
`🔢 Tracking: ${tracking}\n` +
`🏠 Destino: ${destino}\n` +
`📅 Fecha de envío: ${fechaEnvio}\n\n` +
`Adjunto la foto de su guía para que pueda rastrear su pedido cuando quiera.\n\n` +
`Gracias por su compra! 🙏\n` +
`Recuerde que es importante darle los cuidados adecuados:\n` +
`❤️Mantener limpias y secas.\n` +
`❤️Alejar de agentes químicos como alcohol, perfumes, cremas y jabones.\n` +
`❤️Colocar cuando la piel esté seca\n` +
`❤️No mojar ni usar en playa o piscinas\n` +
`❤️Evitar hacer ejercicios con ellas\n\n` +
`De esta manera extenderá la vida útil y brillo de sus piezas ✨ ✨\n\n` +
`Saludos Myriedesign`;

            const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
